name: Feature request
description: Propose a product, documentation, or implementation change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/README.md](https://github.com/DouglasPrado/ushark/blob/main/docs/README.md) and [ROADMAP.md](https://github.com/DouglasPrado/ushark/blob/main/ROADMAP.md) first. Many capabilities are already specified and waiting on implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should change in the product or in the specs?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including "do nothing" or an existing FR.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Concrete scenario (library size, TV vs desktop, sharing, playback, etc.).
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related documents, FR/NFR IDs, screenshots, or prior art.
    validations:
      required: false
